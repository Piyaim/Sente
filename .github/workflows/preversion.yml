# Construit, signe et publie une préversion GitHub à chaque étiquette « v… »
# (exemple : v0.0.1-pre1). La clé de signature vient des secrets du dépôt,
# transmis uniquement aux étapes qui en ont besoin.
name: Préversion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: preversion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preversion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle (vérifie aussi l'intégrité du wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier la présence des secrets de signature
        env:
          SENTE_KEYSTORE_BASE64: ${{ secrets.SENTE_KEYSTORE_BASE64 }}
          SENTE_KEYSTORE_PASSWORD: ${{ secrets.SENTE_KEYSTORE_PASSWORD }}
          SENTE_KEY_ALIAS: ${{ secrets.SENTE_KEY_ALIAS }}
          SENTE_KEY_PASSWORD: ${{ secrets.SENTE_KEY_PASSWORD }}
        run: |
          manquants=0
          for nom in SENTE_KEYSTORE_BASE64 SENTE_KEYSTORE_PASSWORD SENTE_KEY_ALIAS SENTE_KEY_PASSWORD; do
            if [ -z "${!nom}" ]; then
              echo "::error::Secret $nom absent : voir docs/signature.md"
              manquants=1
            fi
          done
          exit $manquants

      - name: Contrôle vie privée (dépendances interdites)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > dependances.txt
          if grep -Ei 'com\.google\.android\.gms|com\.google\.firebase|com\.google\.android\.play|com\.google\.mlkit|crashlytics' dependances.txt; then
            echo "::error::Dépendance Google interdite détectée (voir ci-dessus)."
            exit 1
          fi
          echo "Aucune dépendance interdite."

      - name: Décoder la clé de signature
        env:
          SENTE_KEYSTORE_BASE64: ${{ secrets.SENTE_KEYSTORE_BASE64 }}
        run: echo "$SENTE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sente.p12"

      - name: Construire l'APK signé
        env:
          SENTE_KEYSTORE_PATH: ${{ runner.temp }}/sente.p12
          SENTE_KEYSTORE_PASSWORD: ${{ secrets.SENTE_KEYSTORE_PASSWORD }}
          SENTE_KEY_ALIAS: ${{ secrets.SENTE_KEY_ALIAS }}
          SENTE_KEY_PASSWORD: ${{ secrets.SENTE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Vérifier la signature et préparer les notes
        run: |
          outils="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk="sente-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

          "$outils/apksigner" verify --print-certs "$apk" > signature.txt
          cat signature.txt
          certificat=$(grep -m1 'SHA-256 digest' signature.txt | awk -F': ' '{print $2}')
          permissions=$("$outils/aapt2" dump permissions "$apk" | grep -i 'uses-permission' || true)

          {
            echo "Préversion de test construite et signée par GitHub Actions."
            echo
            echo "**Empreinte SHA-256 de l'APK** : \`$(cut -d' ' -f1 "$apk.sha256")\`"
            echo
            echo "**Certificat de signature (SHA-256)** : \`$certificat\`"
            echo
            echo "**Permissions Android demandées** :"
            if [ -n "$permissions" ]; then
              echo '```'
              echo "$permissions"
              echo '```'
            else
              echo "aucune."
            fi
            echo
            echo "Dépendances complètes : fichier \`dependances.txt\` joint."
          } > notes.md

      - name: Publier la préversion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "sente-${GITHUB_REF_NAME}.apk" \
            "sente-${GITHUB_REF_NAME}.apk.sha256" \
            dependances.txt \
            --prerelease \
            --title "Sente ${GITHUB_REF_NAME}" \
            --notes-file notes.md

      - name: Effacer la clé de la machine
        if: always()
        run: rm -f "$RUNNER_TEMP/sente.p12"
